name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: outbox
          POSTGRES_USER: outbox
          POSTGRES_PASSWORD: outbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outbox -d outbox"
          --health-interval 2s --health-timeout 3s --health-retries 20

      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: outbox
          RABBITMQ_DEFAULT_PASS: outbox
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      # Redpanda is not a GitHub service container: it needs arguments, and a
      # service container cannot take a command.
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:latest \
            redpanda start --smp=1 --memory=1G --mode=dev-container \
              --kafka-addr=external://0.0.0.0:19092 \
              --advertise-kafka-addr=external://localhost:19092
          for i in $(seq 1 60); do
            docker exec redpanda rpk cluster health 2>/dev/null | grep -q 'Healthy:.*true' && exit 0
            sleep 2
          done
          docker logs redpanda
          exit 1

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

      - name: Integration tests
        env:
          OUTBOX_TEST_DSN: postgres://outbox:outbox@localhost:5432/outbox?sslmode=disable
          OUTBOX_TEST_AMQP_DSN: amqp://outbox:outbox@localhost:5672/
          OUTBOX_TEST_KAFKA_BROKERS: localhost:19092
        run: go test -race -tags integration -timeout 15m ./test/integration/...

  # Reported separately from the tests: a vulnerability is a fact about the
  # dependencies, not a failure of the code, and it should not be discovered
  # only by whoever is looking at a red test run.
  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # go.mod says "go 1.26", and without this the action takes whatever
          # patch the runner happens to have cached. That is how a run went
          # green on 1.26.6 and red on 1.26.5 with the same code: the standard
          # library's own advisories are fixed by a patch release, so which one
          # you get decides whether govulncheck has anything to report.
          check-latest: true
      # The same target a developer runs. govulncheck reports only the
      # vulnerabilities the code actually reaches, so a finding here is one
      # somebody has to act on rather than a line in an advisory feed.
      - run: make vuln

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
