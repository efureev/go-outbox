# Publishing, on a tag.
#
# Deliberately built from two actions and a shell rather than from a stack of
# third-party actions: every one of those is a major version to track, and a
# release pipeline that breaks is discovered at the worst possible moment. The
# `gh` CLI and `docker buildx` are preinstalled on GitHub runners.
name: Release

on:
  push:
    tags: ["v*"]

# Signing is keyless: cosign gets a short-lived certificate from Fulcio against
# the workflow's OIDC identity, so there is no private key to store, rotate or
# leak. What a verifier checks is that this repository, on this workflow,
# produced the artefact.
permissions:
  contents: read

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to create the release
      id-token: write          # to get a signing certificate from Fulcio
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0       # tags, so the build stamps a real version

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # Which patch release builds the binaries must not be left to whatever
          # the runner had cached. A standard library advisory is fixed by a
          # patch, so without this a release can ship with known-vulnerable
          # crypto/tls on a day the cache happened to be stale — and nothing in
          # this pipeline would say so.
          check-latest: true

      # The same target a developer runs, so what ships is what was tested.
      # SBOM=1 additionally writes a CycloneDX document per binary, describing
      # the artefact that ships rather than the working tree it came from.
      - name: Cross-compile
        run: make dist SBOM=1 VERSION="${GITHUB_REF_NAME#v}"

      - name: Install cosign
        run: |
          set -euo pipefail
          # Pinned by version and by hash. Fetching a signing tool over the
          # network without checking what came back would be an odd way to
          # start signing things.
          version=v3.1.3
          sha=4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71

          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/$version/cosign-linux-amd64"
          echo "$sha  /tmp/cosign" | sha256sum -c -
          chmod +x /tmp/cosign
          sudo mv /tmp/cosign /usr/local/bin/cosign
          cosign version

      # Signing the checksum file covers every archive and every SBOM through
      # it, so one signature is enough and there is one thing to verify.
      #
      # --bundle, not --output-signature and --output-certificate: those are
      # deprecated in cosign 3, and it refuses to run without a bundle path
      # rather than falling back to them.
      - name: Sign the checksums
        env:
          COSIGN_YES: "true"
        run: cosign sign-blob dist/SHA256SUMS --bundle dist/SHA256SUMS.cosign.bundle

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # The changelog entry for this version becomes the release notes, so
          # the two cannot drift.
          notes=$(awk -v v="$version" \
            '$0 == "## [" v "]" || index($0, "## [" v "] ") == 1 {f=1; next} /^## \[/ {f=0} f' \
            CHANGELOG.md)

          if [ -z "${notes// /}" ]; then
            echo "::warning::no CHANGELOG entry for $version"
            notes="See CHANGELOG.md."
          fi

          prerelease=""
          case "$version" in
            *-*) prerelease="--prerelease" ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            $prerelease \
            dist/*.tar.gz dist/*.cdx.json \
            dist/SHA256SUMS dist/SHA256SUMS.cosign.bundle

  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # to push to ghcr.io
      id-token: write          # to get a signing certificate from Fulcio
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the registry
        run: |
          echo "${{ github.token }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # No QEMU step: the Dockerfile pins both of its builder stages to the
      # build platform and cross-compiles, so nothing is ever emulated.
      - name: Build and push
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # GHCR insists on a lower-case path, and ${var,,} would tie this to
          # bash 4 — true on the runner, false on a developer's macOS.
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          tags="--tag $image:$version"
          case "$version" in
            *-*) ;;                                   # a pre-release moves no floating tag
            *)   tags="$tags --tag $image:${version%.*} --tag $image:latest" ;;
          esac

          # The default builder cannot do multi-platform; this driver can.
          docker buildx create --use --driver docker-container --name release

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$version" \
            --build-arg COMMIT="${GITHUB_SHA::7}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            $tags \
            --metadata-file /tmp/build.json \
            --push .

          # The digest, not a tag: a tag is a name that can be moved to point
          # somewhere else, and a signature against one says nothing about what
          # anybody actually pulls.
          digest=$(python3 -c 'import json;print(json.load(open("/tmp/build.json"))["containerimage.digest"])')
          echo "IMAGE_REF=$image@$digest" >> "$GITHUB_ENV"

      - name: Install cosign
        run: |
          set -euo pipefail
          version=v3.1.3
          sha=4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71

          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/$version/cosign-linux-amd64"
          echo "$sha  /tmp/cosign" | sha256sum -c -
          chmod +x /tmp/cosign
          sudo mv /tmp/cosign /usr/local/bin/cosign

      # After the push rather than before it: the image is already public at
      # this point, so a signing failure costs a red run and a retry, not a
      # release that never happened.
      - name: Sign the image
        env:
          COSIGN_YES: "true"
        run: cosign sign "$IMAGE_REF"
