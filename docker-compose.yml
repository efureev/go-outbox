# Development dependencies. The dispatcher itself is not a service here: it is
# a sidecar that uses the producer's database and broker, so what this file
# provides is a stand-in for those.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: outbox
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbox -d outbox"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: outbox
      RABBITMQ_DEFAULT_PASS: outbox
    ports:
      - "55672:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --mode=dev-container
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Linting and formatting, pinned to the golangci-lint the CI job installs.
  #
  # It is a container rather than a note in the README because a linter that
  # differs between a developer's machine and CI reports different things, and
  # the way that surfaces is a green local run turning into a red pipeline. Keep
  # this tag and the one in .github/workflows/test.yml the same.
  #
  # Not started by `docker compose up`: it is a one-shot command, driven by
  # `make lint` and `make fmt`.
  #
  # The caches sit outside the repository, in a host directory the Makefile
  # creates before mounting it. Inside the working tree they would be picked up
  # by anything that walks it — `gofmt -l .` reporting third-party sources as
  # unformatted — and a named volume would be created root-owned and so
  # unwritable once the container drops to the calling user.
  lint:
    image: golangci/golangci-lint:v2.12-alpine
    working_dir: /app
    environment:
      GOFLAGS: -buildvcs=false
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/go-mod
      GOLANGCI_LINT_CACHE: /cache/golangci-lint
    volumes:
      - .:/app
      - ${LINT_CACHE:-${HOME}/.cache/go-outbox-lint}:/cache
    profiles:
      - tools
    command: golangci-lint run

volumes:
  postgres-data: {}
